<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#cbc6bd",
                      "outline-variant": "#444749",
                      "surface-container-high": "#2a2a2a",
                      "on-background": "#e5e2e1",
                      "on-tertiary-fixed": "#1d1b16",
                      "on-tertiary-fixed-variant": "#494640",
                      "on-primary-fixed-variant": "#444749",
                      "on-secondary-container": "#abb9d2",
                      "inverse-on-surface": "#313030",
                      "surface": "#131313",
                      "error-container": "#93000a",
                      "surface-variant": "#353535",
                      "on-primary": "#2d3133",
                      "on-tertiary-container": "#67645d",
                      "surface-container-low": "#1c1b1b",
                      "on-error": "#690005",
                      "surface-container": "#201f1f",
                      "surface-container-highest": "#353535",
                      "surface-tint": "#c4c7c9",
                      "tertiary": "#ffffff",
                      "background": "#131313",
                      "primary": "#ffffff",
                      "surface-dim": "#131313",
                      "primary-fixed-dim": "#c4c7c9",
                      "on-surface-variant": "#c4c7c9",
                      "secondary-container": "#3c4a5e",
                      "on-secondary-fixed-variant": "#3a485c",
                      "inverse-primary": "#5c5f61",
                      "secondary-fixed-dim": "#b9c7e0",
                      "surface-bright": "#3a3939",
                      "outline": "#8e9193",
                      "inverse-surface": "#e5e2e1",
                      "on-error-container": "#ffdad6",
                      "tertiary-fixed": "#e7e2d9",
                      "secondary-fixed": "#d5e3fd",
                      "on-tertiary": "#32302a",
                      "on-primary-container": "#626567",
                      "error": "#ffb4ab",
                      "tertiary-container": "#e7e2d9",
                      "primary-fixed": "#e0e3e5",
                      "on-secondary": "#233144",
                      "on-secondary-fixed": "#0d1c2f",
                      "secondary": "#b9c7e0",
                      "on-surface": "#e5e2e1",
                      "surface-container-lowest": "#0e0e0e",
                      "on-primary-fixed": "#191c1e",
                      "primary-container": "#e0e3e5"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-desktop": "32px",
                      "unit": "4px",
                      "margin-mobile": "16px",
                      "gutter": "16px",
                      "container-max": "1280px",
                      "touch-target": "44px"
              },
              "fontFamily": {
                      "data-mono": [
                              "JetBrains Mono"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "display-lg": [
                              "JetBrains Mono"
                      ],
                      "headline-md": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "data-mono": [
                              "14px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "0",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "1.5",
                                      "letterSpacing": "0",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "0.1em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "1.5",
                                      "letterSpacing": "0",
                                      "fontWeight": "400"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "1.1",
                                      "letterSpacing": "-0.04em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-cyber-grid {
            background-image: linear-gradient(to right, #334155 1px, transparent 1px),
                              linear-gradient(to bottom, #334155 1px, transparent 1px);
            background-size: 32px 32px;
            background-color: #0F172A;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-data-mono">
<!-- Dimmed Game Background Overlay -->
<div class="absolute inset-0 bg-cyber-grid opacity-20 pointer-events-none"></div>
<div class="absolute inset-0 bg-surface/80 backdrop-blur-sm pointer-events-none z-0"></div>
<!-- Main Menu Container -->
<main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md p-8 border border-outline-variant bg-surface-container-low shadow-[0_0_15px_rgba(255,255,255,0.05)]">
<!-- Header / Brand -->
<div class="mb-12 text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter uppercase border-b-2 border-primary pb-2 mb-2 shadow-[0_4px_10px_-4px_rgba(255,255,255,0.3)]">TETRIS<br/>SUPERVISOR</h1>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest">System Ready</p>
</div>
<!-- Menu Buttons -->
<div class="flex flex-col w-full gap-4">
<!-- Primary Action -->
<button class="h-touch-target flex items-center justify-between px-6 bg-primary text-on-primary border border-primary hover:bg-surface-variant hover:text-primary transition-colors duration-150 active:scale-95 group shadow-[0_0_8px_rgba(255,255,255,0.2)]">
<span class="font-data-mono text-data-mono uppercase font-bold tracking-widest">START GAME</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">play_arrow</span>
</button>
<!-- Secondary Actions -->
<button class="h-touch-target flex items-center justify-between px-6 bg-transparent text-primary border border-outline-variant hover:bg-surface-container-high hover:border-primary transition-colors duration-150 active:scale-95 group">
<span class="font-data-mono text-data-mono uppercase tracking-widest">SETTINGS</span>
<span class="material-symbols-outlined opacity-50 group-hover:opacity-100 transition-opacity">settings</span>
</button>
<button class="h-touch-target flex items-center justify-between px-6 bg-transparent text-primary border border-outline-variant hover:bg-surface-container-high hover:border-primary transition-colors duration-150 active:scale-95 group">
<span class="font-data-mono text-data-mono uppercase tracking-widest">CONTROLS</span>
<span class="material-symbols-outlined opacity-50 group-hover:opacity-100 transition-opacity">sports_esports</span>
</button>
<button class="h-touch-target flex items-center justify-between px-6 bg-transparent text-primary border border-outline-variant hover:bg-surface-container-high hover:border-primary transition-colors duration-150 active:scale-95 group">
<span class="font-data-mono text-data-mono uppercase tracking-widest">HIGH SCORES</span>
<span class="material-symbols-outlined opacity-50 group-hover:opacity-100 transition-opacity">leaderboard</span>
</button>
</div>
<!-- Footer Info -->
<div class="mt-12 w-full flex justify-between items-center border-t border-outline-variant pt-4 opacity-60">
<div class="flex items-center gap-2">
<div class="w-2 h-2 bg-green-500 rounded-none shadow-[0_0_5px_rgba(34,197,94,0.8)]"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">ONLINE</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">V 2.4.1</span>
</div>
</main>
</body></html>
