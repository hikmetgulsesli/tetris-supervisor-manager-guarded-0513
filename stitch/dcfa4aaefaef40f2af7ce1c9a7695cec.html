<body class="bg-background text-on-background antialiased flex flex-col h-screen overflow-hidden selection:bg-error selection:text-on-error min-h-screen">
<!-- Background Grid Effect to simulate the void -->
<div class="fixed inset-0 pointer-events-none z-0" style="background-image: linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px); background-size: 40px 40px; opacity: 0.1;"></div>
<!-- The TopAppBar Shell (Suppressed based on logic - this is a transactional/modal state, but we'll include a muted version for context if needed. Actually, per logic, a Game Over screen is a dead end/transactional overlay. We suppress standard nav.) -->
<!-- Main Game Over Canvas -->
<main class="flex-grow flex items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop py-8">
<!-- The Game Over Overlay Container -->
<div class="w-full max-w-2xl bg-surface-container border border-error relative overflow-hidden flex flex-col shadow-[0_0_32px_rgba(147,0,10,0.3)]">
<!-- Structural Chamfered Tab -->
<div class="absolute top-0 left-0 bg-error px-4 py-1 rounded-br-DEFAULT z-20">
<span class="font-label-caps text-label-caps text-on-error">SYSTEM_FAILURE</span>
</div>
<!-- Header Section -->
<div class="pt-16 pb-8 px-8 text-center border-b border-outline-variant bg-error-container/20">
<div class="flex justify-center items-center mb-4">
<span class="material-symbols-outlined text-error" style="font-size: 48px; font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h1 class="font-display-lg text-display-lg text-error tracking-tighter uppercase">Game Over</h1>
<p class="font-data-mono text-data-mono text-on-surface-variant mt-2">STRUCTURAL INTEGRITY COMPROMISED. BLOCK OUT DETECTED.</p>
</div>
<!-- Statistics Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-[1px] bg-outline-variant p-[1px]">
<!-- Stat: Score -->
<div class="bg-surface-container-high p-6 flex flex-col items-center justify-center group hover:bg-surface transition-colors">
<div class="w-full text-center border-b border-outline-variant pb-2 mb-4 relative">
<span class="font-label-caps text-label-caps text-outline absolute left-0 top-0 hidden md:block">01</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">FINAL SCORE</span>
</div>
<div class="font-headline-md text-headline-md text-primary">124,500</div>
</div>
<!-- Stat: Lines -->
<div class="bg-surface-container-high p-6 flex flex-col items-center justify-center group hover:bg-surface transition-colors">
<div class="w-full text-center border-b border-outline-variant pb-2 mb-4 relative">
<span class="font-label-caps text-label-caps text-outline absolute left-0 top-0 hidden md:block">02</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">LINES CLEARED</span>
</div>
<div class="font-headline-md text-headline-md text-primary">87</div>
</div>
<!-- Stat: Level -->
<div class="bg-surface-container-high p-6 flex flex-col items-center justify-center group hover:bg-surface transition-colors relative">
<!-- High Score Badge (Contextual) -->
<div class="absolute top-2 right-2 text-error">
<span class="material-symbols-outlined" style="font-size: 20px; font-variation-settings: 'FILL' 1;">military_tech</span>
</div>
<div class="w-full text-center border-b border-outline-variant pb-2 mb-4 relative">
<span class="font-label-caps text-label-caps text-outline absolute left-0 top-0 hidden md:block">03</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">LEVEL REACHED</span>
</div>
<div class="font-headline-md text-headline-md text-primary">09</div>
</div>
</div>
<!-- High Score Achievement Banner -->
<div class="bg-surface px-8 py-4 border-b border-outline-variant flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-2 h-2 bg-error"></div>
<span class="font-data-mono text-data-mono text-on-surface">NEW PERSONAL BEST RECORDED</span>
</div>
<span class="material-symbols-outlined text-outline">verified</span>
</div>
<!-- Action Buttons -->
<div class="p-8 flex flex-col sm:flex-row gap-4 justify-end bg-surface-container-low">
<button class="h-touch-target px-8 bg-transparent border border-outline-variant text-primary font-label-caps text-label-caps hover:bg-surface hover:text-primary transition-colors focus:outline-none focus:border-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">menu</span>
                    MAIN MENU
                </button>
<button class="h-touch-target px-8 bg-primary text-on-primary font-label-caps text-label-caps border border-primary hover:bg-tertiary-fixed-dim transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface flex items-center justify-center gap-2 shadow-[0_0_8px_rgba(255,255,255,0.5)]">
<span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'FILL' 1;">replay</span>
                    PLAY AGAIN
                </button>
</div>
<!-- Bottom decorative scanline -->
<div class="h-1 w-full bg-error opacity-50"></div>
</div>
